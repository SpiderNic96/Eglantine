name: release-binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
      platforms:
        description: "Platforms to build: all, or some of windows-x86_64, linux-x86_64, linux-aarch64, macos-arm64, android-arm64 (comma-separated)"
        type: string
        default: all
  # Build the active Pikantine branch on every binary-affecting push. workflow_dispatch remains
  # available for one-off platform rebuilds.
  push:
    branches:
      - main
    # A binary only changes when build inputs change; docs-only pushes skip the build.
    paths:
      - "src/**"
      # Test-only changes cannot change a binary: the build configures with BUILD_TESTING=OFF and
      # YUZU_TESTS=OFF below, so a push that only touches src/tests has nothing to rebuild.
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

# Clang major the Linux PGO build uses, from apt.llvm.org. A clang refuses a profile written by a
# newer LLVM, so this and MSYS2's clang (the Windows job) both have to be at or above the LLVM that
# wrote eglantine.profdata (23: tools/pgo/README.md); bump it when a refreshed profile needs a
# newer one.
env:
  PGO_LLVM_VERSION: "23"
  # Qt for the Linux builds (Windows uses MSYS2's). The boat snapshot has this version in /opt/Qt:
  # run tools/ci/boat-snapshot.sh after changing it, or after changing PGO_LLVM_VERSION.
  QT_VERSION: "6.8.3"
  # Releases are tagged <channel>-build-<number> so they never clash with upstream's build-<number>,
  # and the update checker reads this fork's releases, not notsapinho's.
  RELEASE_CHANNEL: pokecap

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which platforms this run builds: all of them on a push, the chosen ones when started by hand
  # (inputs.platforms), so one platform can be rebuilt without the others.
  plan:
    name: Choose platforms
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.plan.outputs.desktop }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - name: Choose platforms
        id: plan
        shell: bash
        env:
          PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          all='[
            {"platform": "linux-x86_64", "runner": "ubuntu-24.04", "preset": "v3"},
            {"platform": "windows-x86_64", "runner": "windows-2022", "preset": "v3"},
            {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm", "preset": "custom"},
            {"platform": "macos-arm64", "runner": "macos-15", "preset": "custom"}
          ]'
          wanted=$(tr -d ' ' <<< "${PLATFORMS:-all}")
          if [ "$wanted" = all ] || [ -z "$wanted" ]; then
            desktop=$(jq -c . <<< "$all")
            android=true
          else
            desktop=$(jq -c --arg w ",$wanted," '[.[] | .platform as $p | select($w | contains("," + $p + ","))]' <<< "$all")
            android=false
            [[ ",$wanted," == *,android-arm64,* ]] && android=true
          fi
          if [ "$desktop" = "[]" ]; then
            # A matrix may not be empty: a placeholder entry that every build step skips.
            desktop='[{"platform": "none", "runner": "ubuntu-24.04", "preset": "custom"}]'
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "Desktop: $desktop; Android: $android"

  build:
    name: ${{ matrix.platform }} binary
    needs: plan
    if: ${{ !contains(needs.plan.outputs.desktop, '"none"') }}
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      # Paths under the checkout are hashed relative to it, so a cache made on one runner (whose
      # workspace path differs: boat's is not GitHub's) still hits on another.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      # Compilers are installed fresh on every run; compare them by content, not by mtime.
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        # Every build is clang with profile-guided optimization (PGO), the fastest build of the
        # emulator, against the repo's eglantine.profdata: our profile, trained on Pokémon Pokopia
        # with tools/pgo/train-profile.ps1. (Eden's profile, from Switch 1 games, ran Mario Kart
        # World at about half the speed.) Windows uses MSYS2's MinGW clang, which mangles names like
        # the Linux builds: MSVC cannot read an LLVM .profdata file.
        # The x86_64 Linux job runs on a boat.dev sandbox (8 vCPU, 16 GB: https://docs.boat.dev/ci)
        # started from the eglantine-ci snapshot, which has every package, clang, CMake and Qt
        # installed (tools/ci/boat-snapshot.sh). boat has no Windows or Arm machines, so those
        # jobs stay on GitHub's runners.
        # The x86_64 builds target x86-64-v3 (YUZU_BUILD_PRESET v3: AVX2, BMI2, FMA; Intel Haswell
        # and AMD Ryzen or newer). On an older CPU the programs show a message and quit instead of
        # crashing (src/common/x64/cpu_requirements.cpp). The aarch64 build keeps the default.
        # This fork has no boat.dev runner, so x86_64 Linux builds on GitHub's: linux-deps.sh and
        # install-qt-action set it up from scratch. macOS (from upstream Djihads80/Eglantine) uses
        # Homebrew's libraries and Apple clang, which cannot read the LLVM profile: no PGO there.
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # On the boat snapshot every dependency is already installed and this takes a second
      # (tools/ci/linux-deps.sh); on a plain runner it installs them.
      - name: Install Linux dependencies
        id: linux-deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/linux-deps.sh "$PGO_LLVM_VERSION"
          qt="/opt/Qt/$QT_VERSION/gcc_64"
          if [ "$(uname -m)" = x86_64 ] && [ -x "$qt/bin/qmake" ]; then
            echo "Qt $QT_VERSION from the snapshot: $qt"
            # What install-qt-action sets for the Qt it installs.
            {
              echo "QT_ROOT_DIR=$qt"
              echo "QT_PLUGIN_PATH=$qt/plugins"
              echo "LD_LIBRARY_PATH=$qt/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              echo "PKG_CONFIG_PATH=$qt/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            } >> "$GITHUB_ENV"
            echo "$qt/bin" >> "$GITHUB_PATH"
            echo "qt=installed" >> "$GITHUB_OUTPUT"
          fi

      # install-qt-action installs aqtinstall with pip; a plain Ubuntu runner's system Python
      # refuses that (PEP 668), so the job gets its own.
      - name: Python for the Qt installer
        if: runner.os == 'Linux' && steps.linux-deps.outputs.qt != 'installed'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt on Linux
        if: runner.os == 'Linux' && steps.linux-deps.outputs.qt != 'installed'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.arch == 'ARM64' && 'linux_arm64' || 'linux' }}
          target: desktop
          arch: ${{ runner.arch == 'ARM64' && 'linux_gcc_arm64' || 'linux_gcc_64' }}
          modules: qtcharts
          cache: true

      # The packages docs/Deps.md lists for macOS, plus ccache (from upstream Djihads80/Eglantine).
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
            nlohmann-json openssl pkg-config qt@6 sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
            vulkan-loader spirv-tools vulkan-utility-libraries ccache

      # The profile is in the source tree, where both the Linux and MSYS2 configure steps read it.
      # tools/pgo/train-profile.ps1 makes it (tools/pgo/README.md: when to refresh it).
      - name: Check PGO profile
        shell: bash
        run: |
          set -euo pipefail
          test -s eglantine.profdata

      # Eden builds its Windows PGO binaries with MSYS2's clang toolchain, so we do the same. The
      # package list is docs/Deps.md (MSYS2) plus what the bundled FFmpeg needs to compile, and
      # llvm-tools for llvm-ar, which archives the ThinLTO objects.
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # The runner's own MSYS2 (C:\msys64), updated with pacman: no installer download from
          # GitHub, which failed whenever GitHub's release downloads did.
          release: false
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p llvm-tools:p

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-

      # The sha in the key makes every run save a fresh cache (a cache key is never overwritten),
      # and the restore key seeds it from the newest one of the same platform. The "/" after the
      # platform keeps one platform's prefix from matching another's. Saving is a separate step
      # that runs even when the build or a later step fails.
      - name: Restore compiler objects
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects/${{ matrix.platform }}/${{ github.sha }}
          restore-keys: |
            objects/${{ matrix.platform }}/

      # ThinLTO (ENABLE_LTO below): the compile steps write LLVM bitcode, and lld optimizes and
      # compiles it to machine code module by module when it links each program. lld keeps that
      # output for every module in .ltocache (--thinlto-cache-dir), so a later link only redoes the
      # modules whose code or whose imports from other modules changed. Saved and restored like the
      # compiler objects; the build step prunes what the build did not use.
      - name: Restore ThinLTO cache
        # macOS links without ThinLTO, so there is no .ltocache.
        if: runner.os != 'macOS'
        uses: actions/cache/restore@v5
        with:
          path: .ltocache
          key: lto/${{ matrix.platform }}/${{ github.sha }}
          restore-keys: |
            lto/${{ matrix.platform }}/

      - name: Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_UPDATE_CHECKER=ON
            "-DEGLANTINE_BUILD_TAG=${{ env.RELEASE_CHANNEL }}-build-${{ github.run_number }}"
            "-DEGLANTINE_UPDATE_REPO=${{ github.repository }}"
            "-DEGLANTINE_BUILD_PLATFORM=${{ matrix.platform }}"
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
            "-DYUZU_BUILD_PRESET=${{ matrix.preset }}"
            "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
            "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
            -DENABLE_LTO=ON
            "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld -Wl,--thinlto-cache-dir=$PWD/.ltocache -Wl,--thinlto-jobs=all"
          )
          # The -mllvm option names static functions by file name only, as the training build did,
          # so they match although this checkout is elsewhere (tools/pgo/README.md). Clang warns
          # that it is unused on link lines; that is harmless.
          profile="-fprofile-use=$PWD/eglantine.profdata \
            -mllvm -static-func-full-module-prefix=false -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          flags+=("-DCMAKE_C_FLAGS=$profile" "-DCMAKE_CXX_FLAGS=$profile")
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      # MinGW build: system Qt and libraries from MSYS2, clang plus the repo's PGO profile. The profile
      # path is converted to its Windows form because clang runs with the MSYS mount underneath.
      # tools/pgo/train-profile.ps1 configures its instrumented build the same way, with
      # -fprofile-generate for -fprofile-use; keep the two in step.
      - name: Configure MinGW PGO
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") \
            -mllvm -static-func-full-module-prefix=false -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            "-DEGLANTINE_BUILD_TAG=${{ env.RELEASE_CHANNEL }}-build-${{ github.run_number }}" \
            "-DEGLANTINE_UPDATE_REPO=${{ github.repository }}" \
            "-DEGLANTINE_BUILD_PLATFORM=${{ matrix.platform }}" \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            "-DYUZU_BUILD_PRESET=${{ matrix.preset }}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_LTO=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -Wl,--thinlto-cache-dir=$(cygpath -m "$PWD/.ltocache") -Wl,--thinlto-jobs=all" \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            "-DEGLANTINE_BUILD_TAG=${{ env.RELEASE_CHANNEL }}-build-${{ github.run_number }}" \
            "-DEGLANTINE_UPDATE_REPO=${{ github.repository }}" \
            "-DEGLANTINE_BUILD_PLATFORM=${{ matrix.platform }}" \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      # The statistics are zeroed first, so the printed hit rate is this run's, not the cache's lifetime.
      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats > /dev/null
          stamp=$(mktemp)
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats
          bash tools/ci/prune-lto-cache.sh .ltocache "$stamp"

      - name: Build MinGW PGO
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ccache --zero-stats > /dev/null
          stamp=$(mktemp)
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats
          bash tools/ci/prune-lto-cache.sh .ltocache "$stamp"

      - name: Build macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats > /dev/null
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Save compiler objects
        if: always() && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: objects/${{ matrix.platform }}/${{ github.sha }}

      - name: Save ThinLTO cache
        if: always() && !cancelled() && runner.os != 'macOS'
        uses: actions/cache/save@v5
        with:
          path: .ltocache
          key: lto/${{ matrix.platform }}/${{ github.sha }}

      # Plain tar.gz with the two programs. GitHub artifacts drop the executable bit, so a tar is
      # what keeps it. This one is not self-contained: it needs Qt 6 and the usual libraries
      # installed on the system.
      - name: Package Linux tar.gz
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/eglantine
          test -x build/release/bin/eden-cli
          strip build/release/bin/eglantine build/release/bin/eden-cli
          tar -czf "eglantine-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" \
            -C build/release/bin eglantine eden-cli
          ls -la "eglantine-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"

      # A self-contained AppImage: linuxdeploy bundles every library the two programs need except
      # the base system ones (glibc, X11/Wayland client libraries, the GPU driver and Vulkan loader),
      # and its Qt plugin adds the Qt libraries and platform plugins. Runs on glibc 2.39+ systems.
      - name: Package Linux AppImage
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/eglantine
          test -x build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)   # aarch64 or x86_64
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon dev.eglantine.eglantine.
          icon="$RUNNER_TEMP/dev.eglantine.eglantine.png"
          cp dist/Eglantine.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Include Wayland platform plugins and their graphics/shell integrations.
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          # Embedded in the AppImage metadata; matches the release tag (build-N) plus the commit.
          export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="eglantine-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/eglantine \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/dev.eden_emu.eden.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"

      # A dynamic MinGW build is not portable on its own: windeployqt6 brings the Qt libraries and
      # plugins, then every non-system DLL the binaries and those plugins pull in gets copied next to
      # them (docs/Caveats.md#msys2).
      - name: Package MinGW binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f eglantine.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler eglantine.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              # The system DLLs ship with Windows, so they never need bundling.
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in eglantine.exe eden-cli.exe; do
            deps "$exe"
          done
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      # A self-contained app bundle (from upstream Djihads80/Eglantine): macdeployqt copies Qt and
      # every other Homebrew library both programs load into the bundle, then the leftover Homebrew
      # search paths are removed. Ad-hoc signed, not notarized.
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=build/release/bin/eglantine.app
          test -x "$app/Contents/MacOS/eglantine"
          test -x build/release/bin/eden-cli
          cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$app" \
            -executable="$app/Contents/MacOS/eden-cli" -libpath="$(brew --prefix)/lib" \
            -always-overwrite -verbose=1
          # Qt's virtual keyboard input plugin pulls in the QML stack, which the emulator doesn't use.
          rm -f "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          for binary in $binaries; do
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              { grep -E '^/(opt/homebrew|usr/local)/' || true; } | while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
              done
          done
          for program in eglantine eden-cli; do
            install_name_tool -add_rpath @executable_path/../Frameworks \
              "$app/Contents/MacOS/$program" 2> /dev/null
          done
          leaks=$(for binary in $binaries; do
            otool -L "$binary" | grep -E '^\s+/(opt/homebrew|usr/local)/'
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              grep -E '^/(opt/homebrew|usr/local)/'
          done || true)
          if [ -n "$leaks" ]; then
            echo "References still pointing outside the bundle:"
            echo "$leaks" | sort -u
            exit 1
          fi
          # macdeployqt invalidates the signatures; the programs get their entitlements back
          # (hypervisor, JIT: dist/macos/eglantine.entitlements in this tree).
          entitlements=dist/macos/eglantine.entitlements
          codesign --force --deep --sign - "$app"
          if [ -f "$entitlements" ]; then
            codesign --force --sign - --entitlements "$entitlements" "$app/Contents/MacOS/eden-cli"
            codesign --force --sign - --entitlements "$entitlements" "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "eglantine-${GITHUB_SHA}-${{ matrix.platform }}.zip"
          dmgdir=$(mktemp -d)
          ditto "$app" "$dmgdir/eglantine.app"
          ln -s /Applications "$dmgdir/Applications"
          hdiutil create -volname "Eglantine" -srcfolder "$dmgdir" -ov -format UDZO \
            "eglantine-${GITHUB_SHA}-${{ matrix.platform }}.dmg"
          ls -la "eglantine-${GITHUB_SHA}-${{ matrix.platform }}".{zip,dmg}

      # Zipped with ditto beforehand: the bundle's framework symlinks don't survive artifact zipping.
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-${{ matrix.platform }}-${{ github.sha }}
          path: |
            eglantine-${{ github.sha }}-${{ matrix.platform }}.zip
            eglantine-${{ github.sha }}-${{ matrix.platform }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload MinGW binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-${{ matrix.platform }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      # Both Linux files go in one artifact: the tar.gz and the AppImage.
      - name: Upload Linux binary
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-${{ matrix.platform }}-${{ github.sha }}
          path: |
            eglantine-${{ github.sha }}-${{ matrix.platform }}.tar.gz
            eglantine-${{ github.sha }}-${{ matrix.platform }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The Android app (src/android, Eden's Gradle project): the mainline flavor, release build, arm64.
  # Signed with the project's debug key unless ANDROID_KEYSTORE_* secrets are set, so it installs
  # alongside nothing else signed by a different key under the same app id.
  android:
    name: android-arm64 APK
    needs: plan
    if: ${{ needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # glslangValidator compiles the host shaders on the build machine (video_core/host_shaders).
      - name: Install host tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools ninja-build ccache

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The NDK and CMake versions src/android/app/build.gradle.kts asks for.
      - name: Install NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.31.5"

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-android-

      - name: Restore compiler objects
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects/android-arm64/${{ github.sha }}
          restore-keys: |
            objects/android-arm64/

      - name: Build APK
        shell: bash
        env:
          GIT_TAG_NAME: ${{ env.RELEASE_CHANNEL }}-build-${{ github.run_number }}
        run: |
          set -euo pipefail
          cd src/android
          chmod +x gradlew
          ccache --zero-stats > /dev/null
          ./gradlew assembleMainlineRelease --no-daemon \
            "-PYUZU_ANDROID_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          ccache --show-stats
          apk=app/build/outputs/apk/mainline/release/app-mainline-release.apk
          test -s "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/eglantine-${GITHUB_SHA}-android-arm64.apk"

      - name: Save compiler objects
        if: always() && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: objects/android-arm64/${{ github.sha }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-android-arm64-${{ github.sha }}
          path: eglantine-${{ github.sha }}-android-arm64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Publishes the binaries as a GitHub pre-release, tagged <channel>-build-<number>: on pushes to
  # main, and on manual runs unless "Publish the binaries as a GitHub release" is
  # unticked. A platform that failed to build is left out instead of holding back the others.
  release:
    name: Publish release
    needs: [build, android]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publish_release) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: eglantine-*-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          # Asset names drop the commit sha: the release tag already identifies the build.
          strip_sha() { sed "s/-${GITHUB_SHA}//" <<< "$1"; }
          shopt -s nullglob
          downloaded=(artifacts/eglantine-*/)
          if [ ${#downloaded[@]} -eq 0 ] && [ -n "$(ls -A artifacts 2>/dev/null)" ]; then
            # A run that built one platform: download-artifact put that artifact's files straight
            # into artifacts/. Move them into a folder named as the artifact would be.
            if compgen -G "artifacts/*.exe" > /dev/null; then platform=windows-x86_64
            elif compgen -G "artifacts/*.apk" > /dev/null; then platform=android-arm64
            elif compgen -G "artifacts/*.dmg" > /dev/null; then platform=macos-arm64
            elif compgen -G "artifacts/*aarch64*" > /dev/null; then platform=linux-aarch64
            else platform=linux-x86_64
            fi
            one="eglantine-${platform}-${GITHUB_SHA}"
            mkdir "$one"
            mv artifacts/* "$one"/
            mv "$one" artifacts/
            downloaded=("artifacts/$one/")
          fi
          if [ ${#downloaded[@]} -eq 0 ]; then
            echo "No binaries were downloaded into artifacts/: every platform failed" >&2
            exit 1
          fi
          for artifact in "${downloaded[@]}"; do
            name=$(basename "$artifact")
            files=("$artifact"*.AppImage "$artifact"*.tar.gz "$artifact"*.dmg "$artifact"*.apk)
            if [[ "$name" == *macos* ]]; then
              files+=("$artifact"*.zip)
            fi
            if [ ${#files[@]} -gt 0 ]; then
              # Linux, macOS and Android: ship the packaged files as they are.
              for file in "${files[@]}"; do
                cp "$file" "release/$(strip_sha "$(basename "$file")")"
              done
            else
              # Windows: the artifact is the bin folder, zipped once here.
              (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/release/$(strip_sha "$name").zip" .)
            fi
          done
          ls -la release

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_CHANNEL}-build-${GITHUB_RUN_NUMBER}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          row() {
            if [ -e "release/$2" ]; then
              echo "| $1 | [$2](${base}/$2) |"
            else
              echo "| $1 | not built this time (see the workflow run) |"
            fi
          }
          {
            echo "Automatic Pikantine build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}."
            echo
            echo "Experimental and untested. The Windows and Linux packages use clang with profile-guided optimization; the x86_64 ones need a CPU with AVX2 (Intel Haswell or AMD Ryzen and newer)."
            echo
            echo "| System | Download |"
            echo "| --- | --- |"
            row "Windows x86_64 (extract, run \`eglantine.exe\`)" eglantine-windows-x86_64.zip
            row "Linux x86_64 AppImage (glibc 2.39+)" eglantine-linux-x86_64.AppImage
            row "Linux x86_64 tar.gz (system Qt 6)" eglantine-linux-x86_64.tar.gz
            row "Linux aarch64 AppImage" eglantine-linux-aarch64.AppImage
            row "Linux aarch64 tar.gz" eglantine-linux-aarch64.tar.gz
            row "macOS Apple Silicon (.dmg, ad-hoc signed)" eglantine-macos-arm64.dmg
            row "macOS Apple Silicon (.zip)" eglantine-macos-arm64.zip
            row "Android arm64 APK" eglantine-android-arm64.apk
          } > notes.md

          gh release create "${tag}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Pikantine build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md
